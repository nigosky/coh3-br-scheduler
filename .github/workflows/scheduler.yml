name: CoH3 BR Scheduler (Smart Pre-Check Dispatcher)

on:
  schedule:
    # Horario ativo no Brasil (12:00-20:59 BRT = 15:00-23:59 UTC): a cada 5 min fora de pico (gratis no repo publico!)
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 15-23 * * *"
    # Noite/virada no Brasil (21:00-01:59 BRT = 00:00-04:59 UTC): a cada 5 min fora de pico
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0-4 * * *"
    # Madrugada/manha (02:00-11:59 BRT = 05:00-14:59 UTC): a cada 30 min (:07, :37)
    - cron: "7,37 5-14 * * *"
  workflow_dispatch:
    inputs:
      force_dispatch:
        description: "Forcar disparo imediato no repositorio privado mesmo sem novas partidas?"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: coh3-br-scheduler-dispatch
  cancel-in-progress: false

jobs:
  dispatch-private-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Checkout seguro na branch ativa (SHA imutavel)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pre-checagem inteligente na API publica da Relic (33 contas BR)
        id: precheck
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          FORCE_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_dispatch }}
        run: |
          set -euo pipefail
          python3 precheck.py

      - name: Disparar ciclo no repositorio privado somente quando necessario
        if: steps.precheck.outputs.should_dispatch == 'true'
        env:
          TRACKER_DISPATCH_TOKEN: ${{ secrets.TRACKER_DISPATCH_TOKEN }}
          TARGET_OWNER: "nigosky"
          TARGET_REPO: "coh3-br-tracker"
          TARGET_WORKFLOW: "coh3_monitor.yml"
          TARGET_REF: "main"
          PRECHECK_REASON: ${{ steps.precheck.outputs.reason }}
        run: |
          set -euo pipefail

          if [ -z "${TRACKER_DISPATCH_TOKEN:-}" ]; then
            echo "::error::O Secret TRACKER_DISPATCH_TOKEN ainda nao foi configurado neste repositorio (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

          API_URL="https://api.github.com/repos/${TARGET_OWNER}/${TARGET_REPO}/actions/workflows/${TARGET_WORKFLOW}/dispatches"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "${BODY_FILE}"' EXIT

          DISPATCHED=false
          LAST_HTTP="000"

          for attempt in 1 2 3; do
            HTTP_CODE="$(
              curl -sS \
                --proto '=https' \
                --tlsv1.2 \
                --max-time 20 \
                -o "${BODY_FILE}" \
                -w "%{http_code}" \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${TRACKER_DISPATCH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                "${API_URL}" \
                -d "{\"ref\":\"${TARGET_REF}\"}" || echo "000"
            )"
            LAST_HTTP="${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "204" ]; then
              DISPATCHED=true
              break
            fi

            echo "::warning::Tentativa ${attempt}/3 retornou HTTP ${HTTP_CODE} ao disparar ${TARGET_OWNER}/${TARGET_REPO}."
            sleep "$((attempt * 3))"
          done

          if [ "${DISPATCHED}" != "true" ]; then
            echo "::error::Falha ao disparar workflow privado (HTTP ${LAST_HTTP}). Verifique se TRACKER_DISPATCH_TOKEN possui permissao 'Actions: Read and write' no repositorio ${TARGET_OWNER}/${TARGET_REPO}."
            head -c 400 "${BODY_FILE}" || true
            echo ""
            exit 1
          fi

          if [ -f "state.json" ]; then
            git add -- state.json
            if ! git diff --cached --quiet; then
              BRANCH_NAME="${GITHUB_REF_NAME:-main}"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore(precheck): atualizar marcador de partidas [skip ci]"
              for attempt in 1 2 3; do
                git pull --rebase -X theirs origin "${BRANCH_NAME}" || true
                if git push origin "HEAD:${BRANCH_NAME}"; then
                  break
                fi
                sleep 2
              done
            fi
          fi

          echo "Disparo enviado com sucesso para ${TARGET_OWNER}/${TARGET_REPO}@${TARGET_REF} (${PRECHECK_REASON})."

      - name: Resumo da Pre-Checagem Inteligente
        if: always()
        env:
          SHOULD_DISPATCH: ${{ steps.precheck.outputs.should_dispatch }}
          PRECHECK_REASON: ${{ steps.precheck.outputs.reason }}
          OK_ACCOUNTS: ${{ steps.precheck.outputs.ok_accounts }}
        run: |
          UTC_NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          BRT_NOW="$(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M:%S BRT')"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### CoH3 BR Smart Scheduler — Pré-Checagem Relic API"
              echo "- **Horário (BRT):** ${BRT_NOW} (${UTC_NOW})"
              echo "- **Contas verificadas na Relic:** \`${OK_ACCOUNTS:-N/D}\`"
              if [ "${SHOULD_DISPATCH:-false}" = "true" ]; then
                echo "- **Decisão:** 🟢 **DISPARADO** (\`HTTP 204\` → \`nigosky/coh3-br-tracker\`)"
              else
                echo "- **Decisão:** 💤 **ECONOMIZADO (SKIP)** — zero minutos gastos no repositório privado"
              fi
              echo "- **Motivo:** ${PRECHECK_REASON:-N/D}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
